[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "m3undle-provider-simulator"
version = "0.2.0"
description = "Deterministic IPTV provider and stream-failure fixture for proxy integration testing."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "pyyaml==6.0.1",
    "jsonschema==4.10.3",
]

[project.scripts]
provider-simulator = "provider_sim:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["provider_sim", "playback_contract", "materialize_fixtures", "verify_fixture_hashes"]

# Supported install mode is `pip install -e .` from a cloned checkout.
# provider_sim.py resolves FIXTURES_DIR/scenarios/schemas relative to its own
# checkout location (Path(__file__).resolve().parent.parent / "fixtures"),
# so an editable install keeps that layout intact. A regular `pip install .`
# also works for running the console script, but a fully relocatable wheel
# that bundles fixtures/schemas/scenarios as package data -- so the engine
# works after being copied out of a checkout entirely -- is out of scope for
# this pass; that would need the same path-resolution rework as the module
# split, deliberately deferred alongside it.
