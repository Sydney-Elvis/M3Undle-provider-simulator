schema_version: 1
minimum_engine_version: 0.2.0

name: baseline-09-http-429-retry-after
description: >
  Stage A7 baseline #9. Every request to this channel gets HTTP 429 with a
  Retry-After: 20 header -- a provider signaling exactly how long to back
  off before trying again. Distinct from baseline #8, which is a 503 with
  no such guidance.

provider:
  name: baseline-429
  max_streams: 4
  channels:
    rate-limited:
      display_name: HTTP 429 With Retry-After
      group_title: Sim-Baseline
      payload_mode: ts
      failure_mode: http_error
      failure_status_code: 429
      retry_after_seconds: 20

expected_simulator_events:
  - stream_opened
  - stream_http_error
